[build-system]
requires = ["setuptools>=68", "cffi>=1.16"]
build-backend = "setuptools.build_meta"

[project]
name = "pyte"
version = "0.2.0"
description = "Python API wrappers for OKTET Labs Test Environment"
requires-python = ">=3.11"
dependencies = ["cffi>=1.16", "scapy>=2.5"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = ["pytest>=8", "PyYAML>=6"]

[tool.pyte]
# Minimum TE this pyte is ABI-compatible with: a git ref (tag or commit
# hash) your TE checkout must contain. TE now publishes tags, so use a
# tag here -- a bare commit hash is fragile across rebases (TE has
# rebased its history repeatedly, and a hash with no branch or tag
# pointing at it can be dropped and become unreachable, as happened to
# the commit this used to name).
min_te_commit = "v1.77.0"

[tool.ruff]
line-length = 96
# Generated from TE's Configurator model by pyte.cfg._gen, and pinned
# against it by a unit test: a fix here would be undone or fail it.
extend-exclude = ["src/pyte/cfg/gen"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "RUF",  # Ruff-specific rules
    "EXE",  # flake8-executable
]
ignore = [
    # Test scripts carry a shebang but are run through the
    # interpreter, so they are not executable in git.
    "EXE001",
    # "assert a and b" reads fine; splitting it is pure style.
    "PT018",
]
