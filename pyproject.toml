[build-system]
requires = ["setuptools>=68", "cffi>=1.16"]
build-backend = "setuptools.build_meta"

[project]
name = "pyte"
version = "0.1.0"
description = "Python API wrappers for OKTET Labs Test Environment"
requires-python = ">=3.11"
dependencies = ["cffi>=1.16", "scapy>=2.5"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = ["pytest>=8", "PyYAML>=6"]

[tool.pyte]
# Minimum TE this pyte is ABI-compatible with: a git ref (tag or commit
# hash) your TE checkout must contain. TE now publishes tags, so use a
# tag here -- a bare commit hash is fragile across rebases (TE has
# rebased its history repeatedly, and a hash with no branch or tag
# pointing at it can be dropped and become unreachable, as happened to
# the commit this used to name).
min_te_commit = "v1.77.0"

